<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مكتبتي السينمائية</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body {
      background-color: #0f1219;
      color: #ffffff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* القائمة الجانبية */
    .sidebar {
      width: 260px;
      background-color: #161b26;
      border-left: 1px solid #232a3b;
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      overflow-y: auto;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
    }

    .sidebar-header-mobile {
      display: none;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #232a3b;
    }
    .close-sidebar-btn {
      background: #232a3b;
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    /* قسم الفلتر العائلي أسفل القائمة */
    .sidebar-footer {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #232a3b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #c7d0dd;
    }

    /* تصميم زر التبديل (Toggle Switch) */
    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #2b3448;
      transition: 0.25s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      right: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: 0.25s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(-18px); }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 850;
    }
    .sidebar-overlay.open { display: block; }

    .tabs {
      display: flex;
      background: #0f1219;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 18px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #9aa4b2;
      padding: 8px 4px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: 0.2s;
    }
    .tab-btn.active { background: #2b3448; color: #ffffff; }

    .nav-item {
      padding: 10px 12px;
      border-radius: 8px;
      color: #c7d0dd;
      cursor: pointer;
      margin-bottom: 4px;
      font-size: 14px;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-item:hover, .nav-item.active { background-color: #2b3448; color: #ffffff; }

    .section-title {
      font-size: 12px;
      color: #6c788e;
      margin: 16px 12px 8px;
    }

    /* المحتوى الرئيسي */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
    }

    .topbar {
      min-height: 64px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #1e2433;
      background-color: #0f1219;
      flex-shrink: 0;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .menu-btn {
      display: none;
      background: #1a202e;
      border: 1px solid #2b3448;
      color: #ffffff;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .topbar h2 {
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-box {
      background: #1a202e;
      border: 1px solid #2b3448;
      border-radius: 20px;
      padding: 8px 16px;
      color: #ffffff;
      width: 280px;
      max-width: 100%;
      outline: none;
      font-size: 14px;
    }
    .search-box:focus { border-color: #4f7cff; }

    .grid {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
      align-content: start;
    }

    .card {
      position: relative;
      background: transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease;
      outline: none;
    }
    .card:hover, .card:focus { transform: scale(1.04); }
    .card:focus .poster, .card:focus .channel-logo-box { box-shadow: 0 0 0 3px #4f7cff; }

    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 12px;
      object-fit: cover;
      background-color: #1e2433;
      display: block;
    }

    .channel-logo-box {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 12px;
      background-color: #1a202e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border: 1px solid #232a3b;
    }
    .channel-logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .fav-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(15, 18, 25, 0.75);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fav-btn.is-fav { color: #f5c518; }

    .card-info { padding: 8px 4px; }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .card-meta {
      font-size: 12px;
      color: #8c98ad;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rating { color: #f5c518; }

    /* نافذة المشغّل */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      flex-direction: column;
      padding: 16px;
    }
    .modal.open { display: flex; }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .modal-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn, .ctrl-input {
      background: #1e2433;
      color: #fff;
      border: 1px solid #2b3448;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .ctrl-btn.active { background: #4f7cff; border-color: #4f7cff; }
    .ctrl-btn.shield-on { background: #15803d; border-color: #22c55e; }
    .close-btn { background: #d9383a; border: none; font-weight: bold; }
    .ctrl-input { width: 65px; text-align: center; cursor: text; }

    .player-container {
      flex: 1;
      width: 100%;
      display: flex;
    }
    .player-frame, .live-video {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
      background: #000;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: #8c98ad;
      padding: 40px;
      font-size: 16px;
    }

    /* تحسينات واجهة الموبايل */
    @media (max-width: 768px) {
      .menu-btn { display: flex; }
      .sidebar-header-mobile { display: flex; }

      .sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 270px;
        z-index: 900;
        transform: translateX(100%);
        box-shadow: -4px 0 20px rgba(0, 0, 0, 0.6);
      }
      .sidebar.open { transform: translateX(0); }

      .topbar { padding: 10px 14px; flex-wrap: wrap; }
      .topbar-right { flex: 1; }
      .topbar h2 { font-size: 16px; }
      .search-box { width: 100%; order: 3; }

      .grid {
        padding: 14px;
        grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
        gap: 14px;
      }
      .card-title { font-size: 13px; }
    }
  </style>
</head>
<body>

  <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar(false)"></div>

  <!-- القائمة الجانبية -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header-mobile">
      <strong style="font-size:15px;">القائمة</strong>
      <button class="close-sidebar-btn" onclick="toggleSidebar(false)">✖</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('movie', this)">أفلام</button>
      <button class="tab-btn" onclick="switchTab('tv', this)">مسلسلات</button>
      <button class="tab-btn" onclick="switchTab('live', this)">مباشر</button>
    </div>

    <div class="sidebar-content">
      <!-- تصنيفات الأفلام والمسلسلات -->
      <div id="vodSidebar">
        <div class="nav-item" onclick="showFavorites(this)">⭐ المفضلة</div>
        <div class="section-title">التصنيفات</div>
        <div class="nav-item active" onclick="loadCategory('popular', this)">🔥 الأكثر شهرة</div>
        <div class="nav-item" onclick="loadCategory('arabic', this)">🇪🇬 عربي</div>
        <div class="nav-item" onclick="loadCategory('16', this)">🎨 أنيميشن</div>
        <div class="nav-item" onclick="loadCategory('28', this)">💥 أكشن</div>
        <div class="nav-item" onclick="loadCategory('35', this)">😂 كوميدي</div>
        <div class="nav-item" onclick="loadCategory('18', this)">🎭 دراما</div>
        <div class="nav-item" onclick="loadCategory('27', this)">👻 رعب</div>
      </div>

      <!-- تصنيفات القنوات المباشرة -->
      <div id="liveSidebar" style="display:none;">
        <div class="section-title">باقات القنوات</div>
        <div class="nav-item active" onclick="loadLivePlaylist('https://iptv-org.github.io/iptv/countries/eg.m3u', this)">🇪🇬 قنوات مصرية</div>
        <div class="nav-item" onclick="loadLivePlaylist('https://iptv-org.github.io/iptv/languages/ara.m3u', this)">🌍 قنوات عربية</div>
      </div>
    </div>

    <!-- زر الفلتر العائلي -->
    <div class="sidebar-footer">
      <span>🛡️ الفلتر العائلي</span>
      <label class="switch" title="تشغيل/إيقاف الفلتر العائلي">
        <input type="checkbox" id="familyToggle" checked onchange="handleFamilyToggle(this)" />
        <span class="slider"></span>
      </label>
    </div>
  </aside>

  <!-- المحتوى الرئيسي -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-right">
        <button class="menu-btn" onclick="toggleSidebar(true)" aria-label="القائمة">☰</button>
        <h2 id="pageTitle">🔥 الأكثر شهرة</h2>
      </div>
      <input type="text" id="searchInput" class="search-box" placeholder="ابحث هنا..." oninput="handleSearch()" />
    </header>

    <section id="contentGrid" class="grid"></section>
  </main>

  <!-- نافذة المشاهدة -->
  <div id="playerModal" class="modal">
    <div class="modal-header">
      <h3 id="playerTitle">تشغيل</h3>
      <div class="modal-controls">
        <div id="vodControls" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <div id="seriesControls" style="display:none; align-items:center; gap:6px;">
            <span>موسم:</span>
            <input type="number" id="seasonInput" class="ctrl-input" value="1" min="1" onchange="updatePlayerUrl()" />
            <span>حلقة:</span>
            <input type="number" id="episodeInput" class="ctrl-input" value="1" min="1" onchange="updatePlayerUrl()" />
          </div>
          <button class="ctrl-btn active" id="srv1" onclick="changeServer(1)">سيرفر 1</button>
          <button class="ctrl-btn" id="srv2" onclick="changeServer(2)">سيرفر 2</button>
          <button class="ctrl-btn shield-on" id="popupShieldBtn" onclick="togglePopupShield()" title="يمنع فتح النوافذ الإعلانية المنبثقة">🛡️ منع النوافذ: مفعّل</button>
        </div>
        <button class="ctrl-btn close-btn" onclick="closePlayer()">✖ إغلاق</button>
      </div>
    </div>
    <div id="playerContainer" class="player-container"></div>
    <video id="liveVideo" class="live-video" controls autoplay style="display:none;"></video>
  </div>

  <script>
    const TMDB_API_KEY = "7122eb8cf2dec94283457122f73d10c7";
    const FAMILY_PIN = "1234";

    const IMG_BASE = "https://image.tmdb.org/t/p/w500";
    let currentType = 'movie';
    let currentCategory = 'popular';
    let searchTimer = null;
    let currentPlaying = { id: null, type: 'movie', server: 1 };
    let favorites = JSON.parse(localStorage.getItem('myCinemaFavs') || '[]');
    let familyFilterEnabled = localStorage.getItem('myCinemaFamilyFilter') !== 'false';
    let popupShieldEnabled = true;
    let liveChannels = [];
    let hlsInstance = null;

    document.getElementById('familyToggle').checked = familyFilterEnabled;

    function handleFamilyToggle(checkbox) {
      if (!checkbox.checked) {
        const enteredPin = prompt("أدخل الرقم السري لإيقاف الفلتر العائلي:");
        if (enteredPin === FAMILY_PIN) {
          familyFilterEnabled = false;
          localStorage.setItem('myCinemaFamilyFilter', 'false');
          refreshCurrentView();
        } else {
          checkbox.checked = true;
          if (enteredPin !== null) alert("الرقم السري غير صحيح!");
        }
      } else {
        familyFilterEnabled = true;
        localStorage.setItem('myCinemaFamilyFilter', 'true');
        refreshCurrentView();
      }
    }

    function refreshCurrentView() {
      if (currentType === 'live') return;
      const query = document.getElementById('searchInput').value.trim();
      if (query) handleSearch();
      else fetchContent();
    }

    function toggleSidebar(open) {
      document.getElementById('sidebar').classList.toggle('open', open);
      document.getElementById('sidebarOverlay').classList.toggle('open', open);
    }

    function switchTab(type, btn) {
      currentType = type;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('searchInput').value = '';

      if (type === 'live') {
        document.getElementById('vodSidebar').style.display = 'none';
        document.getElementById('liveSidebar').style.display = 'block';
        const firstLive = document.querySelector('#liveSidebar .nav-item');
        loadLivePlaylist('https://iptv-org.github.io/iptv/countries/eg.m3u', firstLive);
      } else {
        document.getElementById('vodSidebar').style.display = 'block';
        document.getElementById('liveSidebar').style.display = 'none';
        fetchContent();
      }
    }

    function loadCategory(cat, el) {
      currentCategory = cat;
      document.querySelectorAll('#vodSidebar .nav-item').forEach(item => item.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('pageTitle').textContent = el.textContent.trim();
      document.getElementById('searchInput').value = '';
      toggleSidebar(false);
      fetchContent();
    }

    function showFavorites(el) {
      document.querySelectorAll('#vodSidebar .nav-item').forEach(item => item.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('pageTitle').textContent = '⭐ المفضلة';
      toggleSidebar(false);
      renderCards(favorites);
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (currentType === 'live') {
        const filtered = liveChannels.filter(ch => ch.name.toLowerCase().includes(query));
        renderLiveChannels(filtered);
        return;
      }

      clearTimeout(searchTimer);
      if (!query) { fetchContent(); return; }
      const adultParam = familyFilterEnabled ? '&include_adult=false' : '&include_adult=true';
      searchTimer = setTimeout(() => {
        const url = `https://api.themoviedb.org/3/search/${currentType}?api_key=${TMDB_API_KEY}&language=ar${adultParam}&query=${encodeURIComponent(query)}`;
        loadFromUrl(url);
      }, 450);
    }

    function fetchContent() {
      const adultParam = familyFilterEnabled ? '&include_adult=false' : '&include_adult=true';
      let url = '';
      if (currentCategory === 'popular') {
        url = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${TMDB_API_KEY}&language=ar${adultParam}&sort_by=popularity.desc`;
      } else if (currentCategory === 'arabic') {
        url = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${TMDB_API_KEY}&language=ar${adultParam}&with_original_language=ar&sort_by=popularity.desc`;
      } else {
        url = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${TMDB_API_KEY}&language=ar${adultParam}&with_genres=${currentCategory}&sort_by=popularity.desc`;
      }
      loadFromUrl(url);
    }

    async function loadFromUrl(url) {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = '<div class="status-msg">جاري التحميل...</div>';
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.status_message) {
          grid.innerHTML = `<div class="status-msg">⚠️ خطأ من TMDB: ${data.status_message}</div>`;
          return;
        }
        let results = data.results || [];
        if (familyFilterEnabled) {
          results = results.filter(item => item.adult !== true);
        }
        if (results.length === 0) {
          grid.innerHTML = '<div class="status-msg">لا توجد نتائج مطابقة.</div>';
          return;
        }
        renderCards(results);
      } catch (err) {
        grid.innerHTML = '<div class="status-msg">حدث خطأ في الاتصال بالإنترنت.</div>';
      }
    }

    function renderCards(items) {
      const grid = document.getElementById('contentGrid');
      if (!items.length) {
        grid.innerHTML = '<div class="status-msg">القائمة فارغة حالياً.</div>';
        return;
      }
      grid.innerHTML = items.map(item => {
        const title = item.title || item.name || 'بدون عنوان';
        const date = item.release_date || item.first_air_date || '';
        const year = date ? date.split('-')[0] : '—';
        const rating = item.vote_average ? item.vote_average.toFixed(1) : '0.0';
        const poster = item.poster_path ? (IMG_BASE + item.poster_path) : 'https://via.placeholder.com/300x450/1e2433/8c98ad?text=No+Image';
        const type = item.media_type || currentType;
        const isFav = favorites.some(f => f.id === item.id);

        return `
          <div class="card" tabindex="0" onclick="openVodPlayer(${item.id}, '${type}', '${title.replace(/'/g, "\\'")}')">
            <button class="fav-btn ${isFav ? 'is-fav' : ''}" onclick="toggleFav(event, ${item.id}, '${type}', '${title.replace(/'/g, "\\'")}', '${item.poster_path || ''}', '${date}', ${item.vote_average || 0})">★</button>
            <img class="poster" src="${poster}" alt="${title}" loading="lazy" />
            <div class="card-info">
              <div class="card-title">${title}</div>
              <div class="card-meta">
                <span>${year}</span>
                <span class="rating">★ ${rating}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleFav(e, id, type, title, poster_path, date, vote_average) {
      e.stopPropagation();
      const index = favorites.findIndex(f => f.id === id);
      if (index > -1) favorites.splice(index, 1);
      else favorites.push({ id, media_type: type, title, poster_path, release_date: date, vote_average });
      localStorage.setItem('myCinemaFavs', JSON.stringify(favorites));
      e.target.classList.toggle('is-fav');
    }

    /* ==================== قسم القنوات المباشرة ==================== */
    async function loadLivePlaylist(m3uUrl, el) {
      document.querySelectorAll('#liveSidebar .nav-item').forEach(i => i.classList.remove('active'));
      if (el) {
        el.classList.add('active');
        document.getElementById('pageTitle').textContent = el.textContent.trim();
      }
      toggleSidebar(false);
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = '<div class="status-msg">جاري تحميل القنوات المباشرة...</div>';

      try {
        const res = await fetch(m3uUrl);
        const text = await res.text();
        liveChannels = parseM3U(text);
        renderLiveChannels(liveChannels);
      } catch (err) {
        grid.innerHTML = '<div class="status-msg">تعذر تحميل قائمة القنوات حالياً.</div>';
      }
    }

    function parseM3U(text) {
      const lines = text.split('\n');
      const channels = [];
      let current = {};
      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          const nameParts = line.split(',');
          current = {
            name: nameParts[nameParts.length - 1] || 'قناة',
            logo: logoMatch ? logoMatch[1] : ''
          };
        } else if (line.startsWith('http')) {
          current.url = line;
          channels.push(current);
          current = {};
        }
      }
      return channels;
    }

    function renderLiveChannels(channels) {
      const grid = document.getElementById('contentGrid');
      if (!channels.length) {
        grid.innerHTML = '<div class="status-msg">لا توجد قنوات مطابقة.</div>';
        return;
      }
      grid.innerHTML = channels.map(ch => `
        <div class="card" tabindex="0" onclick="openLivePlayer('${ch.url}', '${ch.name.replace(/'/g, "\\'")}')">
          <div class="channel-logo-box">
            ${ch.logo
              ? `<img src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.style.display='none'" />`
              : `<span style="font-size:28px;">📺</span>`}
          </div>
          <div class="card-info">
            <div class="card-title">${ch.name}</div>
            <div class="card-meta"><span style="color:#4ade80;">● بث مباشر</span></div>
          </div>
        </div>
      `).join('');
    }

    /* ==================== مشغّل الفيديو ومنع النوافذ المنبثقة ==================== */
    function openVodPlayer(id, type, title) {
      currentPlaying = { id, type, server: 1 };
      document.getElementById('playerTitle').textContent = title;
      document.getElementById('vodControls').style.display = 'flex';
      document.getElementById('seriesControls').style.display = (type === 'tv') ? 'flex' : 'none';
      document.getElementById('playerContainer').style.display = 'flex';
      document.getElementById('liveVideo').style.display = 'none';
      document.getElementById('seasonInput').value = 1;
      document.getElementById('episodeInput').value = 1;
      document.getElementById('playerModal').classList.add('open');
      changeServer(1);
    }

    function togglePopupShield() {
      popupShieldEnabled = !popupShieldEnabled;
      const btn = document.getElementById('popupShieldBtn');
      btn.classList.toggle('shield-on', popupShieldEnabled);
      btn.textContent = popupShieldEnabled ? '🛡️ منع النوافذ: مفعّل' : '🛡️ منع النوافذ: متوقف';
      updatePlayerUrl();
    }

    function openLivePlayer(streamUrl, title) {
      document.getElementById('playerTitle').textContent = '📺 ' + title;
      document.getElementById('vodControls').style.display = 'none';
      document.getElementById('playerContainer').style.display = 'none';
      document.getElementById('playerContainer').innerHTML = '';

      const video = document.getElementById('liveVideo');
      video.style.display = 'block';
      document.getElementById('playerModal').classList.add('open');

      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

      if (Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play();
      }
    }

    function changeServer(num) {
      currentPlaying.server = num;
      document.getElementById('srv1').classList.toggle('active', num === 1);
      document.getElementById('srv2').classList.toggle('active', num === 2);
      updatePlayerUrl();
    }

    function updatePlayerUrl() {
      const { id, type, server } = currentPlaying;
      const s = document.getElementById('seasonInput').value || 1;
      const e = document.getElementById('episodeInput').value || 1;
      let url = '';
      if (server === 1) {
        url = (type === 'movie')
          ? `https://vidsrc.xyz/embed/movie/${id}`
          : `https://vidsrc.xyz/embed/tv/${id}/${s}/${e}`;
      } else {
        url = (type === 'movie')
          ? `https://vidsrc.to/embed/movie/${id}`
          : `https://vidsrc.to/embed/tv/${id}/${s}/${e}`;
      }

      const container = document.getElementById('playerContainer');
      container.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.className = 'player-frame';
      iframe.allowFullscreen = true;
      iframe.allow = 'autoplay; fullscreen';
      iframe.referrerPolicy = 'no-referrer';
      if (popupShieldEnabled) {
        iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-presentation';
      }
      iframe.src = url;
      container.appendChild(iframe);
    }

    function closePlayer() {
      document.getElementById('playerModal').classList.remove('open');
      document.getElementById('playerContainer').innerHTML = '';
      const video = document.getElementById('liveVideo');
      video.pause();
      video.src = '';
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closePlayer();
        toggleSidebar(false);
      }
    });

    fetchContent();
  </script>
</body>
</html>
